[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openlegallexicon"
version = "0.1.0.dev5"
description = "Traceable Chinese–English legal terminology for study and input methods"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["jsonschema==4.26.0", "pypinyin==0.55.0", "opencc-python-reimplemented==0.1.7"]

[project.optional-dependencies]
dev = ["beautifulsoup4==4.14.3", "PyYAML==6.0.3"]
integration = ["anki==26.8.1"]

[project.scripts]
oll = "openlegallexicon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
