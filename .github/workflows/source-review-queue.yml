name: Refresh source review queue
on:
  push:
    branches: [main]
    paths:
      - data/annotations.json
      - data/sources.json
      - data/snapshots/**
      - src/openlegallexicon/model.py
      - tools/build_source_review_queue.py
      - .github/workflows/source-review-queue.yml
  workflow_dispatch:
concurrency:
  group: source-review-queue-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest tests.test_source_review_queue -v
      - run: python tools/build_source_review_queue.py --limit 100
      - name: Commit deterministic review queue only if main has not advanced
        run: |
          git add -- reports/source-review-queue.json
          if git diff --cached --quiet; then exit 0; fi
          validated_sha="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$validated_sha" ]; then
            echo 'main advanced after queue build; skip stale queue publication'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'report: refresh source review queue'
          git push origin HEAD:main
