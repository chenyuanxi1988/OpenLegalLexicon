name: Validate lexicon
on:
  push:
  pull_request:
concurrency:
  group: lexicon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: oll validate
      - run: python tools/download_legal_evidence.py --cache build/legal-evidence --check
      - run: python -m unittest discover -s tests -v
      - run: oll build --out build/ci
      - run: python tools/publish_dictionary.py
      - run: python tools/publish_dictionary.py --check
      - name: Install real Rime engine
        if: matrix.python == '3.12'
        run: sudo apt-get update && sudo apt-get install -y librime-dev librime-bin
      - name: Compile dictionaries and query candidates
        if: matrix.python == '3.12'
        run: python tools/verify_rime.py --bundle build/ci --out build/rime-test.json
      - name: Test real Anki import and reimport
        if: matrix.python == '3.12'
        run: |
          python -m pip install '.[integration]'
          python tools/verify_anki.py --bundle build/ci --out build/anki-test.json
          python tools/verify_anki.py --bundle build/ci --file anki_core.tsv --out build/anki-core-test.json
  publish-dictionary:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python tools/publish_dictionary.py
      - name: Commit generated dictionaries after validation
        run: |
          git add -- dictionary
          if git diff --cached --quiet; then exit 0; fi
          validated_sha="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$validated_sha" ]; then
            echo 'main advanced after this run started; skip stale dictionary publication'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: refresh downloadable dictionaries'
          if ! git push origin HEAD:main; then
            echo 'main advanced during publication; leave publication to the newer workflow run'
            exit 0
          fi
