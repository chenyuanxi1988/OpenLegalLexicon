name: Validate lexicon
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: oll validate
      - run: python -m unittest discover -s tests -v
      - run: oll build --out build/ci
      - name: Install real Rime engine
        if: matrix.python == '3.12'
        run: sudo apt-get update && sudo apt-get install -y librime-dev librime-bin
      - name: Compile dictionaries and query candidates
        if: matrix.python == '3.12'
        run: python tools/verify_rime.py --bundle build/ci --out build/rime-test.json
