name: Merge 2026-09-28 content batch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/merge-company-ma-securities-20260928.yml
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install script conversion helpers
        run: python -m pip install opencc-python-reimplemented==0.1.7 pypinyin==0.55.0
      - name: Merge validated content batch into master lexicon
        env:
          BATCH_B64: >-
            

        run: |
          python - <<'PY2'
          import base64, csv, gzip, io, os
          from pathlib import Path
          from opencc import OpenCC
          from pypinyin import Style, lazy_pinyin

          master_path = Path('lexicon/legal_terms.csv')
          raw = gzip.decompress(base64.b64decode(os.environ['BATCH_B64'])).decode('utf-8-sig')
          new_rows = list(csv.DictReader(io.StringIO(raw)))
          with master_path.open(encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              fieldnames = reader.fieldnames
              old_rows = list(reader)

          assert len(old_rows) == 332, f'expected 332 master rows, found {len(old_rows)}'
          assert len(new_rows) == 198, f'expected 198 batch rows, found {len(new_rows)}'
          assert list(new_rows[0]) == fieldnames, (list(new_rows[0]), fieldnames)

          seen_zh = {r['中文'] for r in old_rows}
          seen_en = {r['英文'].strip().casefold() for r in old_rows}
          seen_id = {r['条目ID'] for r in old_rows}
          conflicts = []
          for r in new_rows:
              if r['中文'] in seen_zh:
                  conflicts.append(('中文', r['中文']))
              if r['英文'].strip().casefold() in seen_en:
                  conflicts.append(('英文', r['英文']))
              if r['条目ID'] in seen_id:
                  conflicts.append(('条目ID', r['条目ID']))
          assert not conflicts, f'duplicate/conflict with master: {conflicts[:30]}'

          cc = OpenCC('s2t')
          for r in new_rows:
              r['繁體'] = cc.convert(r['中文'])
              r['拼音'] = ' '.join(lazy_pinyin(r['中文'], style=Style.TONE3, neutral_tone_with_five=True, errors='default'))

          merged = old_rows + new_rows
          assert len({r['中文'] for r in merged}) == len(merged)
          assert len({r['英文'].strip().casefold() for r in merged}) == len(merged)
          assert len({r['条目ID'] for r in merged}) == len(merged)
          assert len(merged) == 530
          merged.sort(key=lambda r: r['中文'])

          with master_path.open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(merged)

          with master_path.open(encoding='utf-8-sig', newline='') as f:
              check = list(csv.DictReader(f))
          assert len(check) == 530
          assert all(r['中文'] and r['英文'] and r['领域'] and r['条目ID'] for r in check)
          print('master rows:', len(old_rows), 'batch rows:', len(new_rows), 'merged rows:', len(check))
          PY2
      - name: Commit content and remove one-off importer
        run: |
          git rm .github/workflows/merge-company-ma-securities-20260928.yml
          git add lexicon/legal_terms.csv
          validated_sha="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$validated_sha" ]; then
            echo 'main advanced while validating; refusing stale write'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: add 198 company M&A and securities terms'
          git push origin HEAD:main
