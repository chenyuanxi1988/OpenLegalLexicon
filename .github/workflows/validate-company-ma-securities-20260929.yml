name: Validate 2026-09-28 content batch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Decode and validate pending content batch
        run: |
          python - <<'PY'
          import base64, csv, io, re, zlib
          from pathlib import Path

          workflow = Path('.github/workflows/merge-company-ma-securities-20260928.yml').read_text(encoding='utf-8')
          m = re.search(r'BATCH_B64:\s*>-\s*\n(?P<body>.*?)(?=^\s{8}run:\s*\|)', workflow, flags=re.M | re.S)
          assert m, 'BATCH_B64 block not found'
          b64 = ''.join(line.strip() for line in m.group('body').splitlines() if line.strip())
          data = base64.b64decode(b64)
          assert data[:3] == b'\x1f\x8b\x08', f'not gzip: {data[:4]!r}'

          # The historical one-off importer has a bad gzip trailer/CRC. Recover only if
          # the compressed DEFLATE member itself is intact; otherwise fail closed.
          flags = data[3]
          pos = 10
          if flags & 4:
              xlen = int.from_bytes(data[pos:pos+2], 'little'); pos += 2 + xlen
          if flags & 8:
              pos = data.index(b'\x00', pos) + 1
          if flags & 16:
              pos = data.index(b'\x00', pos) + 1
          if flags & 2:
              pos += 2
          compressed = data[pos:-8]
          raw_bytes = zlib.decompress(compressed, -zlib.MAX_WBITS)
          raw = raw_bytes.decode('utf-8-sig')
          rows = list(csv.DictReader(io.StringIO(raw)))

          with Path('lexicon/legal_terms.csv').open(encoding='utf-8-sig', newline='') as f:
              master_reader = csv.DictReader(f)
              fieldnames = master_reader.fieldnames
              master = list(master_reader)

          print('encoded_bytes=', len(data), 'decoded_csv_bytes=', len(raw_bytes))
          print('master_rows=', len(master))
          print('batch_rows=', len(rows))
          assert len(master) == 332, f'expected 332 master rows, found {len(master)}'
          assert len(rows) == 198, f'expected 198 batch rows, found {len(rows)}'
          assert list(rows[0]) == fieldnames, (list(rows[0]), fieldnames)

          required = ['中文','英文','领域','类型','条目ID','译文审核','中文释义','译法说明']
          for i, row in enumerate(rows, start=2):
              missing = [k for k in required if not row.get(k, '').strip()]
              assert not missing, f'row {i} missing {missing}'
              assert row['译文审核'] == 'project_authored', f'row {i} unexpected review={row["译文审核"]!r}'

          old_zh = {r['中文'] for r in master}
          old_en = {r['英文'].strip().casefold() for r in master}
          old_id = {r['条目ID'] for r in master}
          conflicts = []
          for row in rows:
              if row['中文'] in old_zh: conflicts.append(('中文', row['中文']))
              if row['英文'].strip().casefold() in old_en: conflicts.append(('英文', row['英文']))
              if row['条目ID'] in old_id: conflicts.append(('条目ID', row['条目ID']))
          assert not conflicts, f'conflicts with master: {conflicts[:30]}'
          assert len({r['中文'] for r in rows}) == len(rows), 'duplicate Chinese within batch'
          assert len({r['英文'].strip().casefold() for r in rows}) == len(rows), 'duplicate English within batch'
          assert len({r['条目ID'] for r in rows}) == len(rows), 'duplicate IDs within batch'

          from collections import Counter
          domains = Counter()
          kinds = Counter()
          for row in rows:
              for d in row['领域'].split(','):
                  domains[d.strip()] += 1
              kinds[row['类型']] += 1
          print('domains=', dict(domains))
          print('kinds=', dict(kinds))
          print('--- first 20 entries ---')
          for row in rows[:20]:
              print(f"{row['中文']} | {row['英文']} | {row['领域']} | {row['类型']}")
          print('--- last 10 entries ---')
          for row in rows[-10:]:
              print(f"{row['中文']} | {row['英文']} | {row['领域']} | {row['类型']}")
          print('VALIDATION_OK')
          PY
