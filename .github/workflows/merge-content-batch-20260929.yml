name: Merge validated company M&A securities batch
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: merge-content-batch-20260929
  cancel-in-progress: false
jobs:
  validate-and-merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate staged batch and build merged lexicon
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from collections import Counter

          master_path = Path('lexicon/legal_terms.csv')
          batch_path = Path('lexicon/pending_company_ma_securities_20260929.csv')

          with master_path.open(encoding='utf-8-sig', newline='') as f:
              mr = csv.DictReader(f)
              fields = mr.fieldnames
              master = list(mr)
          with batch_path.open(encoding='utf-8-sig', newline='') as f:
              br = csv.DictReader(f)
              batch_fields = br.fieldnames
              batch = list(br)

          print('master_rows=', len(master))
          print('batch_rows=', len(batch))
          assert len(master) == 332, f'expected 332 master rows, got {len(master)}'
          assert len(batch) == 60, f'expected 60 staged rows, got {len(batch)}'
          assert batch_fields == fields, f'header mismatch: {batch_fields!r} != {fields!r}'

          required = ['中文','繁體','英文','领域','来源地区','类型','来源语境','学习注释','来源记录','条目ID','数据许可','译文审核','中文释义','译法说明','法律依据']
          for i, row in enumerate(batch, start=2):
              missing = [k for k in required if not row.get(k, '').strip()]
              assert not missing, f'row {i} missing required fields: {missing}'
              assert row['数据许可'] == 'CC-BY-4.0', f'row {i} bad license: {row["数据许可"]!r}'
              assert row['译文审核'] == 'project_authored', f'row {i} bad review: {row["译文审核"]!r}'
              assert row['来源地区'] == 'INTERNATIONAL', f'row {i} bad source region: {row["来源地区"]!r}'
              if not row['适用法域'].strip():
                  assert 'm_and_a' in row['领域'], f'row {i} blank jurisdiction outside M&A practice: {row["中文"]}'
                  assert '非单一法定术语' in row['法律依据'], f'row {i} blank jurisdiction without practice disclaimer: {row["中文"]}'
              else:
                  assert row['适用法域'] == 'CN', f'row {i} unsupported jurisdiction: {row["适用法域"]!r}'

          def norm(s): return ' '.join(s.split()).casefold()
          old_zh = {norm(r['中文']) for r in master}
          old_en = {norm(r['英文']) for r in master}
          old_id = {r['条目ID'].strip() for r in master}
          conflicts = []
          for row in batch:
              if norm(row['中文']) in old_zh: conflicts.append(('中文', row['中文']))
              if norm(row['英文']) in old_en: conflicts.append(('英文', row['英文']))
              if row['条目ID'].strip() in old_id: conflicts.append(('条目ID', row['条目ID']))
          assert not conflicts, f'conflicts with master: {conflicts[:50]}'

          for label, key, transform in [
              ('中文','中文',norm), ('英文','英文',norm), ('条目ID','条目ID',lambda x:x.strip())
          ]:
              vals = [transform(r[key]) for r in batch]
              dup = [v for v,c in Counter(vals).items() if c > 1]
              assert not dup, f'duplicate {label} within batch: {dup[:20]}'

          merged = master + batch
          assert len(merged) == 392
          merged.sort(key=lambda r: (r['中文'], r['条目ID']))
          with master_path.open('w', encoding='utf-8-sig', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader(); w.writerows(merged)

          domains = Counter()
          kinds = Counter()
          for row in batch:
              for d in row['领域'].split(','):
                  domains[d.strip()] += 1
              kinds[row['类型']] += 1
          print('batch_domains=', dict(sorted(domains.items())))
          print('batch_kinds=', dict(sorted(kinds.items())))
          print('MERGE_VALIDATION_OK total_rows=392')
          PY
      - name: Commit only if main has not advanced
        run: |
          rm -f lexicon/pending_company_ma_securities_20260929.csv
          rm -f .github/workflows/merge-content-batch-20260929.yml
          git add -- lexicon/legal_terms.csv lexicon/pending_company_ma_securities_20260929.csv .github/workflows/merge-content-batch-20260929.yml
          git diff --cached --check
          validated_sha="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$validated_sha" ]; then
            echo 'main advanced after validation; refusing stale merge'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: add 60 company M&A securities terms'
          git push origin HEAD:main
