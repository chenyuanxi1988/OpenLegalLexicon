name: Refresh dispute-resolution legal evidence
on:
  push:
    branches: [main]
    paths:
      - data/evidence/source_targets-dispute.json
      - tools/download_legal_evidence.py
      - tools/build_legal_evidence_candidates.py
      - tools/verify_legal_sources.py
      - src/openlegallexicon/legal_html.py
      - .github/workflows/legal-evidence-dispute.yml
  workflow_dispatch:
concurrency:
  group: legal-evidence-dispute-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate target registry offline
        run: >-
          python tools/download_legal_evidence.py
          --targets data/evidence/source_targets-dispute.json
          --cache build/legal-evidence-dispute
          --check
      - name: Download registered official civil procedure and arbitration law pages
        run: >-
          python tools/download_legal_evidence.py
          --targets data/evidence/source_targets-dispute.json
          --cache build/legal-evidence-dispute
      - name: Build evidence candidate from exact numbered articles
        run: >-
          python tools/build_legal_evidence_candidates.py
          --targets data/evidence/source_targets-dispute.json
          --cache build/legal-evidence-dispute
          --out build/laws-cn-dispute.json
      - name: Stage candidate as formal evidence for validation
        run: cp build/laws-cn-dispute.json data/evidence/laws-cn-dispute.json
      - name: Validate evidence schema and repository invariants
        run: oll validate
      - name: Re-extract and compare every selected article
        run: |
          python tools/verify_legal_sources.py --cache build/legal-evidence-dispute \
            --document-id civil-procedure-law-2023 \
            --document-id arbitration-law-2025 \
            --out build/legal-evidence-dispute-verification.json
      - name: Commit verified evidence only if main has not advanced
        run: |
          git add -- data/evidence/laws-cn-dispute.json
          if git diff --cached --quiet; then exit 0; fi
          validated_sha="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$validated_sha" ]; then
            echo 'main advanced after evidence validation; skip stale evidence publication'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: pin verified CN civil procedure and arbitration evidence'
          if ! git push origin HEAD:main; then
            echo 'main advanced during evidence publication; leave publication to the newer workflow run'
            exit 0
          fi
