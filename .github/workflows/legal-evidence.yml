name: Refresh legal evidence
on:
  push:
    branches: [main]
    paths:
      - data/evidence/source_targets.json
      - tools/download_legal_evidence.py
      - tools/build_legal_evidence_candidates.py
      - tools/verify_legal_sources.py
      - src/openlegallexicon/legal_html.py
      - .github/workflows/legal-evidence.yml
  workflow_dispatch:
concurrency:
  group: legal-evidence-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Download registered official law pages
        run: python tools/download_legal_evidence.py --cache build/legal-evidence
      - name: Build evidence candidate from exact numbered articles
        run: python tools/build_legal_evidence_candidates.py --cache build/legal-evidence --out build/laws-cn-admin-labor.json
      - name: Stage candidate as formal evidence for validation
        run: cp build/laws-cn-admin-labor.json data/evidence/laws-cn-admin-labor.json
      - name: Validate evidence schema and repository invariants
        run: oll validate
      - name: Re-extract and compare every selected article
        run: |
          python tools/verify_legal_sources.py --cache build/legal-evidence \
            --document-id administrative-penalty-law-2021 \
            --document-id administrative-reconsideration-law-2023 \
            --document-id labor-contract-law-2012 \
            --out build/legal-evidence-verification.json
      - name: Commit verified evidence only if main has not advanced
        run: |
          git add -- data/evidence/laws-cn-admin-labor.json
          if git diff --cached --quiet; then exit 0; fi
          validated_sha="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$validated_sha" ]; then
            echo 'main advanced after evidence validation; skip stale evidence publication'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: pin verified CN administrative and labor law evidence'
          if ! git push origin HEAD:main; then
            echo 'main advanced during evidence publication; leave publication to the newer workflow run'
            exit 0
          fi
